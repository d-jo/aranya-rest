[package]
name = "aranya-viz-coordinator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aranya-viz-coordinator"
path = "src/main.rs"

[dependencies]
aranya-daemon = { path = "../aranya-daemon" }
aranya-daemon-api = { path = "../aranya-daemon-api" }
aranya-rest = { path = "../aranya-rest" }
aranya-util = { path = "../aranya-util" }
aranya-crypto = { version = "0.7.1", features = ["alloc", "aqc", "fs-keystore", "clone-aead", "std"] }
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.24"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
clap = { version = "4.0", features = ["derive"] }
thiserror = "1.0"
tempfile = "3.6.0"